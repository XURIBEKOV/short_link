<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azamatjon Dilmurodov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFEDD8;
    --accent: #E7BC91;
    --accent-dark: #d9a874;
    --text: #4a3320;
    --muted: #8a6e55;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Work Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(20px, 6vw, 56px) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
  }
  .page { width: 100%; max-width: clamp(320px, 92vw, 480px); text-align: center; }
  .avatar {
    width: clamp(88px, 28vw, 128px); height: clamp(88px, 28vw, 128px); border-radius: 50%;
    object-fit: cover; border: 3px solid var(--accent);
    background: var(--accent); display: block; margin: 0 auto 16px;
  }
  h1 { font-family: "Libre Baskerville", Georgia, serif; font-size: clamp(1.3rem, 5.5vw, 1.9rem); font-weight: 700; overflow-wrap: anywhere; }
  .bio { color: var(--muted); margin: 8px auto 24px; max-width: 32ch; line-height: 1.5; font-size: clamp(.9rem, 3.6vw, 1rem); }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: clamp(12px, 3.5vw, 16px) clamp(14px, 4vw, 20px); border-radius: 14px; min-height: 56px;
    background: var(--accent); color: var(--text);
    text-decoration: none; font-weight: 700; text-align: left;
    transition: transform .15s, background .15s;
  }
  .link:hover, .link:focus-visible { transform: translateY(-2px); background: var(--accent-dark); outline: none; }
  .icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--bg); display: grid; place-items: center; flex-shrink: 0;
  }
  .icon svg { width: 22px; height: 22px; fill: none; stroke: var(--text); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .link .label { min-width: 0; overflow-wrap: anywhere; }
  .link span.label small { display: block; font-weight: 400; opacity: .75; font-size: .8rem; }

  .ask { margin-top: 28px; }
  .ask-btn {
    display: block; padding: 16px; border-radius: 14px;
    background: var(--accent); color: var(--text);
    text-decoration: none; font-weight: 700;
    transition: background .15s;
  }
  .ask-btn:hover, .ask-btn:focus-visible { background: var(--accent-dark); outline: none; }
  footer { margin-top: 32px; color: var(--muted); font-size: .8rem; text-align: center; }
  @media (min-width: 768px) {
    .page { max-width: 520px; }
    .link { padding: 18px 22px; }
  }
  @media (max-width: 360px) {
    .icon { width: 36px; height: 36px; }
    .link { gap: 10px; }
  }
  @media (max-height: 520px) and (orientation: landscape) {
    body { padding-top: 16px; }
    .avatar { width: 72px; height: 72px; margin-bottom: 8px; }
    .bio { margin-bottom: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
</style>
</head>
<body>
  <main class="page">
    <img class="avatar" src="avatar.jpg" alt="DILMURODOV AZAMATJON" onerror="this.removeAttribute('src')">
    <h1>DILMURODOV AZAMATJON</h1>
    <p class="bio">Dilmurodov Azamatjonning ijtimoiy tarmoqlardagi shaifalari</p>

    <section class="links">
      <a class="link" href="https://yolchiconsalting.consalting.workers.dev" target="_blank" rel="noopener">
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg></span>
        <span class="label">Website<small>Saytimizga o'ting</small></span>
      </a>
      <a class="link" href="https://t.me/+K_2q05NOUKE2ZWZi" target="_blank" rel="noopener">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 4 3 11l5 2 2 6 3-4 5 4z"/><path d="m8 13 9-6"/></svg></span>
        <span class="label">Telegram<small>Menga yozing</small></span>
      </a>
      <a class="link" href="https://www.instagram.com/italiyadaa?vrfl=MTh5bDJ2YTZuN2g4cQ==" target="_blank" rel="noopener">
        <span class="icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".8"/></svg></span>
        <span class="label">Instagram<small>Sahifamizga obuna bo'ling</small></span>
      </a>
    </section>

    <section class="ask">
      <a class="ask-btn" href="https://t.me/azamatjon_dilmurodov_bot" target="_blank" rel="noopener">Savolingizni yozib qoldiring</a>
    </section>

    <footer>© 2026 DILMURODOV AZAMATJON</footer>
  </main>
</body>
</html>
